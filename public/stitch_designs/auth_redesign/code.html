<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RecipeNest - Sign Up</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#F97316", // Vibrant Orange
                        "background-light": "#F8FAFC",
                        "background-dark": "#0F172A",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
<style>.glass-card {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.5)
    }
.dark .glass-card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1)
    }
.nav-glass {
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px)
    }
.dark .nav-glass {
    background: rgba(15, 23, 42, 0.3)
    }
.bg-kitchen {
    background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuDgOJOdGAKRAtRnW65WicRtBDB8Zs56aFFUSLPK8WD_XpIJ3B-feaE08reFu_2PSIzEkkBLbobNcnDXp0FgS7V0ovppapdZwxtofP5n2os1NEJmf0JKiE8pMX_8jD1ZB8-_DGNrArOqwPShjWhhtiRKoJZdTI8AAb-6h60EK0a6STPjIOO4yWokjbD4NsC8GNPivL1T4iKjkpIL7zpHDEgTgZdSaoQ0M-rFhTCX2StmHNAt9OWb6Ej9KacaEblzfYU9MSViCdRzUa0u);
    background-size: cover;
    background-position: center
    }
.orange-glow {
    box-shadow: 0 4px 20px -2px rgba(249, 115, 22, 0.5)
    }</style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen overflow-x-hidden transition-colors duration-300">
<div class="fixed inset-0 bg-kitchen z-0"></div>
<div class="fixed inset-0 backdrop-blur-sm bg-white/10 dark:bg-black/20 z-0"></div>
<nav class="fixed top-0 left-0 right-0 z-50 nav-glass border-b border-white/20">
<div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
<div class="flex items-center space-x-2">
<div class="bg-primary p-1.5 rounded-lg">
<span class="material-symbols-outlined text-white text-2xl">restaurant</span>
</div>
<span class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">RecipeNest</span>
</div>
<div class="hidden md:flex items-center space-x-10 text-sm font-medium text-gray-800 dark:text-gray-100">
<a class="hover:text-primary transition-colors" href="#">Home</a>
<a class="hover:text-primary transition-colors" href="#">How it works</a>
<a class="hover:text-primary transition-colors" href="#">Menu</a>
<a class="hover:text-primary transition-colors" href="#">About</a>
<a class="hover:text-primary transition-colors" href="#">Contact</a>
</div>
<div class="flex items-center space-x-6">
<button class="p-2 text-gray-700 dark:text-gray-200 hover:bg-white/20 rounded-full transition-all">
<span class="material-symbols-outlined">search</span>
</button>
<a class="px-8 py-2.5 border-2 border-gray-800 dark:border-white rounded-full text-sm font-semibold text-gray-900 dark:text-white hover:bg-gray-900 hover:text-white dark:hover:bg-white dark:hover:text-black transition-all" href="#">
                    Login
                </a>
<button class="p-2 text-gray-700 dark:text-gray-200 hover:bg-white/20 rounded-full transition-all" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined dark:hidden">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block">light_mode</span>
</button>
</div>
</div>
</nav>
<main class="relative z-10 flex items-center justify-center min-h-screen pt-20 pb-12 px-4">
<div class="w-full max-w-lg">
<div class="glass-card rounded-[40px] p-10 md:p-12 shadow-2xl animate-fade-in-up">
<div class="text-center mb-10">
<h1 class="text-4xl font-semibold text-gray-900 dark:text-white mb-2">Sign Up</h1>
<p class="text-gray-600 dark:text-gray-300">Start your culinary journey today</p>
</div>
<form class="space-y-5" onsubmit="event.preventDefault()">
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400 group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-gray-500 dark:text-white" placeholder="Enter your name" type="text"/>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400 group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-gray-500 dark:text-white" placeholder="Enter your email" type="email"/>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-gray-500 dark:text-white" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 dark:text-gray-400 group-focus-within:text-primary transition-colors">lock_person</span>
<input class="w-full pl-12 pr-12 py-4 bg-white/40 dark:bg-white/5 border border-white/50 dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-gray-500 dark:text-white" placeholder="Confirm your password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<button class="w-full bg-primary hover:bg-orange-600 text-white font-bold py-4 rounded-full orange-glow transition-all active:scale-[0.98] mt-4">
                        Sign Up
                    </button>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/20 dark:border-white/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-transparent px-2 text-gray-500 dark:text-gray-400 font-medium tracking-widest">or</span>
</div>
</div>
<button class="w-full flex items-center justify-center space-x-3 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-4 rounded-full shadow-sm transition-all active:scale-[0.98]">
<img alt="Google" class="w-6 h-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcXsaFNkJUXhEk5YMuBXLsIftGz9_yFAgd73afnNXwXH6cf16LE4th-iAAuKpGCRftSGAfyB86LH7JvPSXCwOKelZzLZqLYyl3oToR0rFHE2IwZTHdwfIWJ-qRWcSGP-mVTMorK5H3uEJY2wp7f8ir1Rn0A5j5zPwTm7n-aqWaxWi3m67azB0hg6qIFQOyRwWwXtmGZ2s4-EsXOvCFZKklbSJAZz_We0-E0cjp8Ft-f4g1SszmQMI0ENFsa7dVgBx-w2yYOIu4pKW4"/>
<span>Sign up with Google</span>
</button>
<p class="text-center text-gray-800 dark:text-gray-200 mt-8 text-sm">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
</form>
</div>
<div class="mt-8 text-center text-white/70 dark:text-white/40 text-xs">
<p>© 2024 RecipeNest Inc. All rights reserved.</p>
<div class="mt-2 space-x-4">
<a class="hover:text-white underline decoration-white/20" href="#">Privacy Policy</a>
<a class="hover:text-white underline decoration-white/20" href="#">Terms of Service</a>
</div>
</div>
</div>
</main>
<style>
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
        }
    </style>

</body></html>
