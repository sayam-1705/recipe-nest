<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RecipeNest - Create Recipe (Mobile)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FF914D",
                        secondary: "#FFB082",
                        "background-light": "#F8F9FC", 
                        "background-dark": "#121212",
                        "surface-light": "rgba(255, 255, 255, 0.75)",
                    },
                    fontFamily: {
                        display: ["Outfit", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        'xl': '1.25rem',
                        '2xl': '1.75rem',
                        '3xl': '2.25rem',
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.05)',
                        'glow': '0 0 15px rgba(255, 145, 77, 0.25)',
                        'glow-hover': '0 0 25px rgba(255, 145, 77, 0.4)',
                    }
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-[#F8F9FC] font-body text-gray-800 antialiased;
                background-image: 
                    radial-gradient(at 0% 0%, rgba(255, 145, 77, 0.08) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(255, 145, 77, 0.08) 0px, transparent 50%);
                background-attachment: fixed;
            }
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(229, 231, 235, 0.8);
            @apply transition-all duration-300;
        }
        .glass-input:focus {
            @apply border-primary outline-none ring-4 ring-primary/10 bg-white;
        }
        .fixed-footer {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }
        .preview-toggle:checked ~ .preview-content {
            display: block;
        }
        .preview-toggle:checked ~ .preview-header .expand-icon {
            transform: rotate(180deg);
        }.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-32">
<header class="fixed top-0 w-full z-50 glass-nav">
<div class="px-5 h-16 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-orange-600 flex items-center justify-center text-white shadow-glow">
<span class="material-symbols-outlined text-xl">restaurant_menu</span>
</div>
<span class="font-display font-bold text-xl text-gray-900 tracking-tight">Recipe<span class="text-primary">Nest</span></span>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 bg-white/50 border border-white/50">
<span class="material-symbols-outlined">light_mode</span>
</button>
</div>
</header>
<main class="mt-20 px-5 space-y-6">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="text-xs font-bold text-primary uppercase tracking-widest">Step 1 of 4</span>
<h2 class="text-lg font-display font-bold text-gray-900">Basics</h2>
</div>
<div class="w-24 h-1.5 bg-gray-200 rounded-full overflow-hidden">
<div class="w-1/4 h-full bg-primary rounded-full"></div>
</div>
</div>
<div class="glass-card rounded-2xl overflow-hidden">
<input class="hidden preview-toggle" id="preview-toggle" type="checkbox"/>
<label class="preview-header flex items-center justify-between p-4 cursor-pointer" for="preview-toggle">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">visibility</span>
<span class="font-bold text-sm text-gray-700">Live Preview</span>
</div>
<div class="flex items-center gap-3">
<span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-[10px] font-bold uppercase">Auto-saving</span>
<span class="material-symbols-outlined expand-icon transition-transform duration-300 text-gray-400">expand_more</span>
</div>
</label>
<div class="preview-content hidden px-4 pb-4">
<div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100">
<div class="relative h-40">
<img alt="Recipe Preview" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDY9dLa-IMu2lIrqjW2CK3tCwHFzhg2PK7rrdYVVGTC2mb4f9xj4a3uk1GqWJiKzHUMi9MKp4iULUDDiqUfAt7qjLbjosFKyqAM13XuP8iv-k_1AT2AMy00jrGaCS3c4qLLH1KNMTSNfZ_r-ZEI90oQW2UneUky5fe3nmU3zUL2nN95g6UfItNC5BSJ_P3QNqOGZI9VJc7pUDem-x1bVTnjGQk8Jj8iCsJl3jDhSZbJhtSMtGtTzBr_bUOOZRQEKaWcr4DlyJUsxcGm"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
<div class="absolute bottom-3 left-3 right-3 text-white">
<h3 class="font-display font-bold text-base leading-tight">Glazed Salmon with Asparagus</h3>
</div>
</div>
<div class="p-3 flex items-center justify-between border-t border-gray-50">
<div class="flex items-center gap-2">
<img alt="Chef" class="w-6 h-6 rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjMF9fgBcNh8J7sCKNOJOfQASDwqJjKjCWD8we_o2Btsy8TqjCRD6H9ngw9NHioDL_Inh3nrUczsfx5s3eO7i5feT--KVCZ33xau3ULVLqCHXF4Jizn7L_QEm1cwv6zp76o2dXWmSVZhVDonJjDW4N5s75BrLYJT675oM64DmjbyXzbKygT7aVY6xtXUIpC1i71kMUVS85pZN21P5MQR5wb6WJHJYMJxZxRAXyuKiObbA65am1Ec8jXZYwkRuB5A-aAl9BcLWQk6cr"/>
<span class="text-[10px] font-bold text-gray-600">Elena C.</span>
</div>
<div class="flex items-center gap-2">
<span class="flex items-center gap-0.5 text-[10px] bg-orange-50 text-orange-600 px-1.5 py-0.5 rounded-md font-bold">
<span class="material-symbols-outlined text-xs">schedule</span> 65m
                            </span>
</div>
</div>
</div>
</div>
</div>
<section class="space-y-5">
<header>
<h1 class="text-2xl font-display font-bold text-gray-900 leading-tight">Recipe Essentials</h1>
<p class="text-sm text-gray-500 mt-1">First, the fundamental details.</p>
</header>
<div class="space-y-5">
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-600 ml-1 uppercase tracking-wider">Recipe Title</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 text-xl">edit_square</span>
</div>
<input class="glass-input w-full rounded-xl py-3.5 pl-11 pr-4 text-base font-medium text-gray-900 placeholder-gray-400" placeholder="e.g. Classic Beef Tacos" type="text" value="Glazed Salmon with Asparagus"/>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-600 ml-1 uppercase tracking-wider">Prep Time</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 text-xl">timer</span>
</div>
<input class="glass-input w-full rounded-xl py-3.5 pl-11 pr-4 text-base font-medium text-gray-900" placeholder="Min" type="text" value="65 min"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-600 ml-1 uppercase tracking-wider">Servings</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 text-xl">group</span>
</div>
<input class="glass-input w-full rounded-xl py-3.5 pl-11 pr-4 text-base font-medium text-gray-900" placeholder="Qty" type="number" value="4"/>
</div>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-600 ml-1 uppercase tracking-wider">Difficulty Level</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 text-xl">signal_cellular_alt</span>
</div>
<select class="glass-input w-full rounded-xl py-3.5 pl-11 pr-10 text-base font-medium text-gray-900 appearance-none bg-transparent">
<option>Easy</option>
<option selected="">Medium</option>
<option>Hard</option>
<option>Expert</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400">expand_more</span>
</div>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold text-gray-600 ml-1 uppercase tracking-wider">Category</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 text-xl">restaurant</span>
</div>
<select class="glass-input w-full rounded-xl py-3.5 pl-11 pr-10 text-base font-medium text-gray-900 appearance-none bg-transparent">
<option>Breakfast</option>
<option selected="">Main Course</option>
<option>Dessert</option>
<option>Salads</option>
<option>Appetizers</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400">expand_more</span>
</div>
</div>
</div>
<div class="space-y-1.5 pb-4">
<label class="text-xs font-bold text-gray-600 ml-1 uppercase tracking-wider">Short Description</label>
<div class="relative">
<textarea class="glass-input w-full rounded-xl p-4 text-base font-medium text-gray-900 placeholder-gray-400 resize-none leading-relaxed" placeholder="Describe your dish in a few words..." rows="4"></textarea>
<div class="absolute bottom-3 right-3">
<span class="text-[10px] font-bold text-gray-400 bg-gray-50 px-1.5 py-0.5 rounded border border-gray-100">0/300</span>
</div>
</div>
</div>
</div>
</section>
</main>
<footer class="fixed bottom-0 w-full p-5 fixed-footer z-50">
<div class="flex items-center gap-3">
<button class="flex-1 px-4 py-4 rounded-xl bg-white text-gray-700 font-bold text-sm shadow-sm border border-gray-200 flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-lg">save</span>
                Save Draft
            </button>
<button class="flex-[1.5] px-4 py-4 rounded-xl bg-gradient-to-r from-primary to-orange-600 text-white font-bold text-sm shadow-glow flex items-center justify-center gap-2 active:scale-95 transition-transform">
                Next Step
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<div class="h-4"></div>
</footer>

</body></html>
