name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (match your local version)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run ESLint
      - name: Lint
        run: npm run lint

      # 5. TypeScript type check (safe to remove if you're using plain JS)
      - name: Type check
        run: npx tsc --noEmit

      # 6. Build the Next.js app — catches build-breaking errors before Vercel does
      - name: Build
        run: npm run build
